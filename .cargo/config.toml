# 本机 cargo 网络配置
#
# 动机：首次编译 Tauri 依赖树需要从 crates.io 拉取数百个 crate，
# 中途出现瞬时 DNS/连接抖动会直接让整个构建失败，即使 99% 的包已经下好。
# 这里提高重试次数，让构建对网络抖动有韧性，而不是改用第三方镜像源
# （换镜像会改变依赖来源，引入不必要的供应链风险）。
[net]
retry = 10

# 显式使用 sparse 协议：相比旧的 git index，它只按需拉取单个 crate 的元数据，
# 请求量小得多，在国内网络下成功率明显更高。
[registries.crates-io]
protocol = "sparse"
